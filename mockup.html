<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0B0D">
<title>HENZFLIX — Stories</title>
<style>
  :root{
    --red:#FF2D3A;
    --red-dark:#D91E2B;
    --red-soft:rgba(255,45,58,.14);
    --bg:#0B0B0D;
    --bg-elev:#141417;
    --card:#1A1A1F;
    --line:#2A2A31;
    --ink:#F5F5F7;
    --ink-soft:#BDBDC6;
    --grey:#8B8B95;
    --chip:#1F1F25;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --player-h:0px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;overscroll-behavior:none;
  }
  body{height:100dvh;width:100%;}
  button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
  input{font-family:inherit;}

  .screen{
    position:relative;width:100%;height:100%;height:100dvh;
    max-width:600px;margin:0 auto;
    background:var(--bg);overflow:hidden;
    display:flex;flex-direction:column;
    border-left:1px solid #16161a;border-right:1px solid #16161a;
  }
  .app{flex:1;position:relative;min-height:0;overflow:hidden;}

  /* ---------- Views ---------- */
  .view{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);overflow:hidden;}
  .view.active{display:flex;}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain;}
  .scroll::-webkit-scrollbar{display:none;}

  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-top)) 14px 10px;flex-shrink:0;background:var(--bg);}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.4px;}
  .play-badge{width:28px;height:20px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,45,58,.45);}
  .play-badge:after{content:"";border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #fff;margin-left:2px;}
  .spacer{flex:1;}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .icon-btn:active{background:var(--chip);}
  .page-title{font-size:22px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;}

  /* ---------- Chips ---------- */
  .chips{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;padding:8px 15px;border-radius:20px;background:var(--chip);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;transition:background .15s;}
  .chip.active{background:var(--red);border-color:var(--red);color:#fff;}

  /* ---------- Cards ---------- */
  .feed{padding-bottom:10px;}
  .card{cursor:pointer;margin-bottom:6px;}
  .thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--card);}
  .thumb-wrap img,.thumb-wrap video{width:100%;height:100%;object-fit:cover;display:block;}
  .ep-badge{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:6px;}
  .ep-badge svg{display:block;}
  .match{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:12px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 10px rgba(255,45,58,.4);}
  .series-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);}
  .series-prog i{display:block;height:100%;background:var(--red);}
  .card-body{display:flex;gap:10px;padding:11px 14px 16px;align-items:flex-start;}
  .card-text{flex:1;min-width:0;}
  .card-title{font-size:15.5px;font-weight:700;line-height:1.3;margin:0 0 4px;letter-spacing:-.15px;}
  .card-meta{font-size:12.5px;color:var(--grey);line-height:1.4;}
  .card-desc{font-size:13px;color:var(--ink-soft);line-height:1.4;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .why{margin-top:7px;font-size:12px;color:#ff8c93;font-weight:600;display:flex;gap:5px;align-items:center;}
  .card-more{flex-shrink:0;color:var(--ink-soft);width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin:-4px -6px 0 0;border-radius:50%;}
  .card-more:active{background:var(--chip);}

  /* ---------- Ads ---------- */
  .ad-tag{display:inline-block;font-size:10.5px;font-weight:700;color:#0B0B0D;background:#E9E9EE;padding:1px 6px;border-radius:4px;margin-right:4px;}
  .ad-art{position:absolute;inset:0;overflow:hidden;}
  .ad-art img{width:100%;height:100%;object-fit:cover;display:block;}
  .ad-flag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;color:#0B0B0D;background:#E9E9EE;padding:3px 8px;border-radius:5px;}
  .cta{flex-shrink:0;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:9px 15px;border-radius:18px;white-space:nowrap;}
  .cta:active{background:var(--red-dark);}
  .cta.sm{font-size:12px;padding:8px 13px;}
  .banner-ad{display:flex;align-items:center;gap:11px;margin:6px 14px 14px;padding:10px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;cursor:pointer;}
  .ba-art{width:46px;height:46px;border-radius:10px;flex-shrink:0;overflow:hidden;}
  .ba-art img{width:100%;height:100%;object-fit:cover;display:block;}
  .ba-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .ba-text .ad-tag{align-self:flex-start;margin:0 0 2px;}
  .ba-text b{font-size:13.5px;line-height:1.25;}
  .ba-text small{font-size:11.5px;color:var(--grey);}

  /* ---------- Continue watching ---------- */
  .continue{display:flex;gap:12px;margin:2px 14px 14px;padding:10px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;cursor:pointer;align-items:center;}
  .continue .cthumb{position:relative;width:112px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--card);}
  .continue .cthumb img,.continue .cthumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .continue .ctext{flex:1;min-width:0;}
  .continue .clabel{font-size:11.5px;color:#ff8c93;font-weight:700;margin-bottom:3px;}
  .continue .ctitle{font-size:13.5px;font-weight:700;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .continue .csub{font-size:12px;color:var(--grey);margin-top:3px;}
  .ai-strip{display:flex;align-items:center;gap:8px;margin:0 14px 12px;padding:9px 12px;border-radius:12px;background:var(--red-soft);color:#ffb3b8;font-size:12.5px;font-weight:600;}
  .ai-strip svg{flex-shrink:0;}

  /* ---------- Tab bar ---------- */
  .tabbar{display:flex;border-top:1px solid var(--line);background:rgba(11,11,13,.96);flex-shrink:0;padding-bottom:var(--safe-bottom);}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;color:var(--grey);}
  .tab.active{color:var(--red);}
  .tab span{font-size:10.5px;font-weight:600;}
  .screen.in-player .tabbar{display:none;}

  /* ---------- Player (sticky) ---------- */
  .player-sticky{position:sticky;top:0;z-index:30;background:#000;padding-top:var(--safe-top);box-shadow:0 6px 18px rgba(0,0,0,.55);}
  .player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer;}
  /* poster (thumbnail) sits underneath; the video fades in only once it is actually playing */
  .player-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block;}
  .player-wrap>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity .3s ease;}
  .player-wrap.vid-ready>video{opacity:1;}
  .player-spinner{position:absolute;top:50%;left:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border:4px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:none;z-index:6;pointer-events:none;}
  .player-wrap.buffering .player-spinner{display:block;}
  .player-scrim{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,.05) 40%,rgba(0,0,0,.55));}
  .player-back{position:absolute;top:10px;left:10px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;}
  .ep-chip{position:absolute;top:14px;right:12px;z-index:5;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:12px;}
  .player-controls{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;gap:26px;}
  .ctl{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  .ctl.big{width:60px;height:60px;background:rgba(255,45,58,.92);box-shadow:0 0 30px rgba(255,45,58,.5);}
  .player-progress-row{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 12px 8px;}
  .progress-track{height:4px;background:rgba(255,255,255,.3);border-radius:2px;position:relative;margin:8px 0 0;}
  .progress-track:before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px;}
  .progress-fill{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:2px;width:0;}
  .progress-fill:after{content:"";position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,45,58,.3);}
  .time-row{display:flex;justify-content:space-between;font-size:11px;font-weight:600;margin-top:6px;text-shadow:0 1px 2px rgba(0,0,0,.6);}

  /* ad overlay inside player */
  .ad-overlay{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;justify-content:space-between;padding:12px;}
  .ad-overlay.show{display:flex;}
  .ad-bg{position:absolute;inset:0;z-index:-1;overflow:hidden;}
  .ad-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .ad-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,.15) 45%,rgba(0,0,0,.7));}
  .ad-top{display:flex;align-items:center;gap:8px;padding-left:44px;font-size:12px;font-weight:700;position:relative;z-index:2;}
  .ad-headline{font-size:17px;font-weight:800;text-align:center;padding:0 22px;line-height:1.25;position:relative;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.6);}
  .ad-bottom{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;padding-bottom:4px;}
  .skip-btn{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:8px;}
  .skip-btn.ready{background:#fff;color:#0B0B0D;}
  .ad-timer{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25);z-index:3;}
  .ad-timer i{display:block;height:100%;width:0;background:var(--red);}
  .player-wrap.ad-on .player-controls,.player-wrap.ad-on .player-progress-row,.player-wrap.ad-on .ep-chip{display:none;}

  /* info */
  .player-info{padding:14px 16px 4px;}
  .player-title{font-size:18px;font-weight:800;line-height:1.3;margin:0 0 6px;letter-spacing:-.25px;}
  .player-now{font-size:13.5px;font-weight:700;color:#ff8c93;margin-bottom:3px;}
  .player-meta{font-size:12.5px;color:var(--grey);}
  .action-row{display:flex;gap:9px;overflow-x:auto;padding:12px 16px 14px;scrollbar-width:none;}
  .action-row::-webkit-scrollbar{display:none;}
  .pill{flex-shrink:0;display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:9px 15px;font-size:13px;font-weight:600;}
  .pill.split{padding:0;overflow:hidden;}
  .pill.split .half{padding:9px 15px;display:flex;align-items:center;gap:7px;}
  .pill.split .divider{width:1px;background:var(--line);align-self:stretch;margin:8px 0;}
  .pill.on{color:var(--red);border-color:rgba(255,45,58,.5);background:var(--red-soft);}
  .pill svg{display:block;}

  /* AI summary card */
  .ai-card{margin:0 14px 14px;padding:13px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(255,45,58,.16),rgba(255,45,58,.04));border:1px solid rgba(255,45,58,.28);}
  .ai-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:9px;}
  .beta{font-size:10.5px;font-weight:700;background:var(--red);color:#fff;padding:2px 7px;border-radius:9px;}
  .ai-toggle{margin-left:auto;display:flex;background:rgba(0,0,0,.35);border-radius:14px;padding:2px;}
  .ai-toggle button{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:12px;color:var(--ink-soft);}
  .ai-toggle button.on{background:var(--red);color:#fff;}
  .ai-body{font-size:13.5px;line-height:1.5;color:var(--ink-soft);min-height:40px;}
  .ai-body.typing:after{content:"▍";color:var(--red);margin-left:1px;animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0}}
  .ai-btn{margin-top:10px;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:9px 15px;border-radius:18px;display:inline-flex;gap:6px;align-items:center;}

  /* Episodes */
  .episodes{border-top:8px solid var(--bg-elev);}
  .ep-head{position:sticky;top:var(--player-h);z-index:25;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line);}
  .ep-head-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .ep-head-top h2{margin:0;font-size:16px;font-weight:800;}
  .ep-head-top .count{color:var(--grey);font-size:13px;font-weight:600;}
  .auto{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .switch{width:38px;height:22px;border-radius:12px;background:#3a3a42;position:relative;transition:background .2s;}
  .switch:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
  .switch.on{background:var(--red);}
  .switch.on:after{transform:translateX(16px);}
  .ranges{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .ranges::-webkit-scrollbar{display:none;}
  .range{flex-shrink:0;padding:6px 13px;border-radius:16px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-soft);}
  .range.active{background:var(--red);border-color:var(--red);color:#fff;}
  .ep-row{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 8px;cursor:pointer;border-left:3px solid transparent;}
  .ep-row.now{background:var(--red-soft);border-left-color:var(--red);}
  .ep-num{width:24px;text-align:center;font-size:12.5px;font-weight:700;color:var(--grey);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .ep-row.now .ep-num{color:var(--red);}
  .ep-thumb{position:relative;width:118px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--card);}
  .ep-thumb img,.ep-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .ep-thumb .dur{position:absolute;right:4px;bottom:6px;background:rgba(0,0,0,.8);font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;}
  .ep-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);}
  .ep-prog i{display:block;height:100%;background:var(--red);}
  .ep-text{flex:1;min-width:0;}
  .ep-title{font-size:13.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ep-sub{font-size:11.5px;color:var(--grey);margin-top:3px;}
  .ep-sub svg{vertical-align:-2px;margin-right:2px;}
  .ep-ad{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 8px;margin:4px 0;cursor:pointer;background:var(--bg-elev);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .ep-ad .ep-num{color:var(--grey);}
  .ep-ad .ep-thumb{background:var(--card);}
  .more-label{padding:14px 16px 10px;font-size:16px;font-weight:800;border-top:8px solid var(--bg-elev);display:flex;align-items:center;gap:8px;}

  /* ---------- Search ---------- */
  .search-header{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-top)) 12px 10px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .search-input-wrap{flex:1;display:flex;align-items:center;gap:9px;background:var(--chip);border:1px solid var(--line);border-radius:22px;padding:0 8px 0 14px;height:42px;}
  .input-stack{position:relative;flex:1;height:22px;}
  .ghost,.input-stack input{position:absolute;inset:0;font-size:15px;line-height:22px;height:22px;padding:0;margin:0;letter-spacing:0;font-family:inherit;}
  .ghost{white-space:pre;overflow:hidden;pointer-events:none;color:transparent;}
  .ghost .hint{color:#5d5d68;}
  .input-stack input{width:100%;background:transparent;border:none;outline:none;color:var(--ink);}
  .input-stack input::placeholder{color:var(--grey);}
  .clear-btn{display:none;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;color:var(--ink-soft);}
  .sg-row{display:flex;align-items:center;gap:13px;padding:12px 16px;font-size:15px;cursor:pointer;}
  .sg-row:active{background:var(--bg-elev);}
  .sg-row .sg-ic{width:22px;display:flex;justify-content:center;color:var(--grey);flex-shrink:0;}
  .sg-row.ai .sg-ic{color:var(--red);}
  .sg-row .sg-text{flex:1;min-width:0;color:var(--ink-soft);}
  .sg-row .sg-text b{color:var(--ink);font-weight:700;}
  .sg-row .fill{color:var(--grey);width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
  .sg-tag{font-size:10.5px;font-weight:700;color:var(--red);border:1px solid rgba(255,45,58,.5);padding:1px 6px;border-radius:8px;margin-left:8px;}
  .sg-title{padding:16px 16px 4px;font-size:13px;font-weight:700;color:var(--grey);display:flex;align-items:center;}
  .sg-title button{margin-left:auto;color:var(--red);font-size:12.5px;font-weight:700;}
  .dym{padding:12px 16px;font-size:14px;color:var(--ink-soft);}
  .dym button{color:var(--red);font-weight:800;}
  .understood{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:12px 16px 12px;font-size:13px;color:var(--ink-soft);}
  .understood .tagpill{background:var(--red-soft);color:#ff8c93;font-weight:700;font-size:12px;padding:4px 10px;border-radius:12px;}
  .empty{padding:36px 24px;text-align:center;color:var(--grey);font-size:14px;line-height:1.5;}

  /* ---------- AI picks ---------- */
  .ai-prompt{margin:4px 14px 12px;display:flex;gap:8px;}
  .ai-prompt .field{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:22px;padding:0 14px;height:44px;display:flex;align-items:center;gap:8px;}
  .ai-prompt input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;min-width:0;}
  .ai-prompt input::placeholder{color:var(--grey);}
  .ai-msg{margin:4px 14px 12px;padding:12px 14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;font-size:13.5px;line-height:1.5;color:var(--ink-soft);}
  .ai-msg b{color:var(--ink);}
  .thinking{display:flex;align-items:center;gap:10px;margin:8px 14px;padding:14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;font-size:13.5px;color:var(--ink-soft);}
  .dots{display:flex;gap:4px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:bounce 1s infinite;}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  .taste{margin:4px 14px 16px;padding:14px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;}
  .taste h3{margin:0 0 3px;font-size:15px;font-weight:800;}
  .taste p{margin:0 0 12px;font-size:12.5px;color:var(--grey);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;font-weight:600;}
  .bar-row span{width:92px;color:var(--ink-soft);flex-shrink:0;}
  .bar-row .bar{flex:1;height:7px;border-radius:4px;background:#26262d;overflow:hidden;}
  .bar-row .bar i{display:block;height:100%;background:var(--red);border-radius:4px;transition:width .5s;}
  .section-title{padding:14px 16px 10px;font-size:18px;font-weight:800;letter-spacing:-.3px;}

  /* ---------- Library ---------- */
  .lib-row{display:flex;gap:12px;padding:8px 14px;align-items:center;cursor:pointer;}
  .lib-thumb{position:relative;width:130px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--card);}
  .lib-thumb img,.lib-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .lib-thumb .dur{position:absolute;right:5px;bottom:7px;background:rgba(0,0,0,.8);font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px;}
  .lib-text{flex:1;min-width:0;}
  .lib-text b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.3;}
  .lib-text span{display:block;margin-top:4px;font-size:12px;color:var(--grey);}

  /* ---------- Sheet + toast ---------- */
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:600;}
  .backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:610;background:var(--bg-elev);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s ease;padding:8px 0 calc(12px + var(--safe-bottom));border-top:1px solid var(--line);}
  .sheet.show{transform:none;}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:#3a3a42;margin:0 auto 8px;}
  .sheet-title{padding:6px 18px 10px;font-size:13.5px;color:var(--grey);font-weight:600;line-height:1.35;}
  .sheet-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;font-size:15px;font-weight:600;text-align:left;}
  .sheet-item:active{background:var(--card);}
  .sheet-item svg{flex-shrink:0;color:var(--ink-soft);}
  .toast{position:absolute;left:50%;bottom:calc(74px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);background:#26262d;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:20px;font-size:12.5px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:700;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .screen.in-player .toast{bottom:calc(24px + var(--safe-bottom));}

  /* ---------- Badges (replaces AI match %) ---------- */
  .badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:6px;letter-spacing:.3px;}
  .badge-new{color:#6FB4FF;}
  .badge-trending{color:#FF9B4D;}
  .badge-popular{color:#C08BFF;}
  .badge-hot{color:#FF7079;}

  /* ---------- Wallet pill + profile avatar ---------- */
  .wallet-pill{display:flex;align-items:center;gap:5px;background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:0 11px;height:32px;font-size:13px;font-weight:800;color:#FFCB66;margin-right:2px;flex-shrink:0;}
  .wallet-pill:active{background:#26262c;}
  .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0018);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0;}

  /* ---------- Locked episodes ---------- */
  .ep-lock{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:20px;}
  .ep-row.locked .ep-title,.ep-row.locked .ep-sub{color:var(--ink-soft);}
  .ep-sub.locked-sub{color:#FFCB66;font-weight:700;}

  /* ---------- Modal (auth / wallet / unlock / settings) ---------- */
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .2s;z-index:800;}
  .modal-backdrop.show{opacity:1;pointer-events:auto;}
  .modal-card{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:810;background:var(--bg-elev);border:1px solid var(--line);border-radius:18px;max-height:82vh;overflow-y:auto;padding:20px 18px calc(18px + var(--safe-bottom));}
  .modal-card.show{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1);}
  .modal-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:4px;}
  .modal-title svg{color:#FFCB66;}
  .cp-coins svg,.unlock-cost svg{color:#FFCB66;}
  .modal-sub svg{vertical-align:-3px;color:#FFCB66;}
  .modal-sub{font-size:13px;color:var(--grey);line-height:1.4;margin-bottom:14px;}
  .form-group{display:flex;flex-direction:column;gap:10px;margin-bottom:4px;}
  .form-input{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--ink);outline:none;}
  .form-input::placeholder{color:var(--grey);}
  .modal-switch{text-align:center;font-size:13px;color:var(--grey);margin-top:14px;}
  .modal-switch button{color:var(--red);font-weight:700;}
  .coin-packs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
  .coin-pack{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .coin-pack:active{background:#26262d;}
  .cp-coins{font-size:15px;font-weight:800;display:flex;align-items:center;gap:4px;}
  .cp-bonus{font-size:10px;font-weight:700;color:#3ddc84;margin-left:2px;}
  .cp-price{font-size:12.5px;color:var(--grey);font-weight:700;}
  .unlock-cost{display:flex;align-items:center;gap:7px;font-size:22px;font-weight:800;background:var(--red-soft);color:#ffb3b8;padding:12px 14px;border-radius:14px;justify-content:center;margin-top:6px;}
  .settings-acct{display:flex;align-items:center;gap:12px;padding:6px 0 16px;}
  .settings-acct div:last-child{display:flex;flex-direction:column;}
  .settings-acct span{font-size:12.5px;color:var(--grey);margin-top:2px;}
  .avatar-lg{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0018);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0;}
  .settings-row-title{font-size:12.5px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px;}
  .settings-options{display:flex;gap:8px;flex-wrap:wrap;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600;}

  /* ---------- Auth screen ---------- */
  .screen.fullscreen-view .tabbar{display:none;}
  .auth-scroll{padding:calc(18px + var(--safe-top)) 24px calc(30px + var(--safe-bottom));}
  .auth-close{background:var(--chip);}
  .auth-topbar{display:flex;align-items:center;gap:8px;}
  .auth-logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;letter-spacing:-.3px;color:var(--ink-soft);}
  .auth-logo .play-badge{width:24px;height:17px;border-radius:5px;box-shadow:0 0 12px rgba(255,45,58,.4);}
  .auth-logo .play-badge:after{border-width:4.5px 0 4.5px 7px;margin-left:1px;}
  .auth-hero{text-align:center;margin:34px 0 26px;}
  .auth-hero h1{font-size:23px;font-weight:800;margin:0 0 6px;letter-spacing:-.4px;}
  .auth-hero p{font-size:13.5px;color:var(--grey);margin:0;}
  .auth-tabs{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:26px;}
  .auth-tab{flex:1;padding:11px 0;border-radius:11px;font-size:14px;font-weight:700;color:var(--ink-soft);text-align:center;}
  .auth-tab.active{background:var(--red);color:#fff;}
  .input-field{position:relative;margin-bottom:14px;}
  .input-field .field-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--grey);display:flex;pointer-events:none;}
  .input-field input{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:14px 44px 14px 42px;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s;}
  .input-field input::placeholder{color:var(--grey);}
  .input-field input:focus{border-color:var(--red);}
  .toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--grey);width:26px;height:26px;display:flex;align-items:center;justify-content:center;}
  .field-row-between{display:flex;justify-content:flex-end;margin:-4px 0 18px;}
  .link-btn{font-size:13px;color:var(--red);font-weight:700;}
  .auth-primary{width:100%;background:var(--red);color:#fff;font-size:15px;font-weight:800;padding:14px;border-radius:12px;text-align:center;box-shadow:0 8px 20px rgba(255,45,58,.3);}
  .auth-primary:active{background:var(--red-dark);}
  .auth-divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--grey);font-size:12px;font-weight:600;}
  .auth-divider:before,.auth-divider:after{content:"";flex:1;height:1px;background:var(--line);}
  .social-row{display:flex;gap:10px;}
  .social-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;}
  .social-btn:active{background:#26262d;}
  .auth-terms{font-size:11.5px;color:var(--grey);text-align:center;margin-top:24px;line-height:1.55;}
  .auth-terms a{color:var(--ink-soft);font-weight:700;text-decoration:underline;}
  .auth-switch{text-align:center;font-size:13.5px;color:var(--grey);margin-top:18px;}
  .auth-switch b{color:var(--red);font-weight:700;}

  /* ---------- Settings screen (professional grouped layout) ---------- */
  .settings-header{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-top)) 8px 12px 6px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .settings-header h1{font-size:17px;font-weight:800;margin:0;}
  .settings-account-card{display:flex;align-items:center;gap:14px;margin:16px 14px;padding:16px;background:var(--bg-elev);border:1px solid var(--line);border-radius:16px;}
  .settings-account-card .sac-info{flex:1;min-width:0;}
  .settings-account-card .sac-info b{font-size:15px;display:block;}
  .settings-account-card .sac-info span{display:block;font-size:12.5px;color:var(--grey);margin-top:2px;}
  .settings-section{margin:22px 14px 0;}
  .settings-section-label{font-size:11.5px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.6px;padding:0 4px 8px;}
  .settings-group{background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .settings-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);}
  .settings-item:first-child{border-top:none;}
  .settings-item .si-icon{width:30px;height:30px;border-radius:9px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;}
  .settings-item .si-text{flex:1;font-size:14.5px;font-weight:600;min-width:0;}
  .settings-item .si-value{font-size:13px;color:var(--grey);font-weight:600;flex-shrink:0;}
  .settings-item.clickable{cursor:pointer;}
  .settings-item.clickable:active{background:#212127;}
  .quality-sheet-row{display:flex;gap:8px;padding:12px 14px 14px;flex-wrap:wrap;border-top:1px solid var(--line);}
  .settings-footer{text-align:center;font-size:11.5px;color:var(--grey);padding:28px 0 32px;line-height:1.6;}

  /* ---------- VIP ---------- */
  .cta.gold{background:#FFCB66;color:#1a1200;}
  .cta.gold:active{background:#e6b556;}
  .vs-ic{width:36px;height:36px;border-radius:50%;background:rgba(255,203,102,.16);color:#FFCB66;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .vs-text{flex:1;min-width:0;}
  .vs-text b{display:block;font-size:14px;line-height:1.25;}
  .vs-text small{display:block;font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .vip-strip,.vip-offer{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;background:linear-gradient(135deg,rgba(255,203,102,.18),rgba(255,203,102,.04));border:1px solid rgba(255,203,102,.35);cursor:pointer;}
  .vip-strip{margin:4px 14px 12px;}
  .vip-strip.inline{margin:10px 14px 6px;}
  .vip-offer{width:100%;text-align:left;color:var(--ink);}
  .vip-price{font-size:30px;font-weight:800;color:#FFCB66;margin:2px 0 14px;}
  .vip-price small{font-size:14px;font-weight:600;color:var(--grey);}
  .vip-perks{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--ink-soft);}
  .vip-perks li{display:flex;align-items:flex-start;gap:9px;line-height:1.35;}
  .vip-perks svg{color:#FFCB66;flex-shrink:0;margin-top:1px;}
  .vip-fine{font-size:11.5px;color:var(--grey);text-align:center;margin-top:10px;line-height:1.45;}
  .avatar.vip{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #FFCB66;}
  .avatar-lg.vip{box-shadow:0 0 0 2px var(--bg-elev),0 0 0 4px #FFCB66;}

  /* ---------- Card preview: thumbnail first, video only on demand ---------- */
  @keyframes spin{to{transform:rotate(360deg)}}
  /* the <video> sits above the thumbnail but stays invisible until it is actually playing */
  .thumb-wrap video.t-vid{position:absolute;inset:0;opacity:0;transition:opacity .35s ease;pointer-events:none;background:#000;}
  .thumb-wrap.vid-ready video.t-vid{opacity:1;}
  .vid-spinner{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid rgba(255,255,255,.28);border-top-color:var(--red);border-radius:50%;animation:spin .75s linear infinite;display:none;z-index:2;pointer-events:none;}
  .thumb-wrap.loading .vid-spinner{display:block;}
  .preview-tag{position:absolute;bottom:8px;left:8px;display:none;align-items:center;gap:4px;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);color:#fff;font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:6px;}
  .thumb-wrap.vid-ready .preview-tag{display:flex;}
  .preview-tag svg{display:block;}

  /* ---------- Hide controls / progress while playing ---------- */
  .player-back,.player-controls,.player-progress-row,.ep-chip,.player-tools-row{opacity:1;transition:opacity .25s;}
  .player-wrap.playing:not(.show-controls) .player-back,
  .player-wrap.playing:not(.show-controls) .player-controls,
  .player-wrap.playing:not(.show-controls) .player-progress-row,
  .player-wrap.playing:not(.show-controls) .ep-chip{opacity:0;pointer-events:none;}

  /* ---------- Player tools: subtitles + fullscreen ---------- */
  .player-tools-row{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;}
  .tool-btn{width:30px;height:30px;border-radius:8px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;}
  .tool-btn.on{background:var(--red);}
  .subtitle-overlay{position:absolute;left:10%;right:10%;bottom:56px;z-index:4;text-align:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);display:none;pointer-events:none;}
  .subtitle-overlay.show{display:block;}
  .subtitle-overlay span{background:rgba(0,0,0,.55);padding:3px 8px;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
  .player-wrap.ad-on .subtitle-overlay{display:none;}
  .player-wrap:fullscreen,.player-wrap:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;}
  .player-wrap:fullscreen>img,.player-wrap:-webkit-full-screen>img,
  .player-wrap:fullscreen>video,.player-wrap:-webkit-full-screen>video{object-fit:contain;background:#000;}
  .player-wrap:fullscreen .subtitle-overlay,.player-wrap:-webkit-full-screen .subtitle-overlay{bottom:64px;font-size:15px;}

  /* ---------- Comments ---------- */
  .comments{border-top:8px solid var(--bg-elev);padding:16px 16px 4px;}
  .comments-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .comments-head h2{margin:0;font-size:16px;font-weight:800;}
  .comments-head .count{color:var(--grey);font-size:13px;font-weight:600;}
  .comment-input-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:20px;}
  .comment-input-row textarea{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink);resize:none;min-height:20px;max-height:80px;outline:none;font-family:inherit;}
  .comment-input-row textarea:focus{border-color:var(--red);}
  .comment-post-btn{flex-shrink:0;background:var(--red);color:#fff;font-size:12.5px;font-weight:700;padding:10px 14px;border-radius:12px;}
  .comment{display:flex;gap:10px;margin-bottom:18px;}
  .comment .c-avatar{width:32px;height:32px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink-soft);flex-shrink:0;}
  .comment .c-body{flex:1;min-width:0;}
  .comment .c-head{display:flex;align-items:center;gap:7px;font-size:12.5px;}
  .comment .c-head b{font-size:13px;}
  .comment .c-head span{color:var(--grey);}
  .comment .c-text{font-size:13.5px;line-height:1.45;margin-top:3px;color:var(--ink-soft);}
  .comment .c-actions{display:flex;align-items:center;gap:16px;margin-top:6px;font-size:12px;color:var(--grey);}
  .comment .c-actions button{display:flex;align-items:center;gap:4px;color:var(--grey);font-weight:600;}
  .comment .c-actions button.liked{color:var(--red);}
  .comment .c-actions svg{display:block;}

  /* ---------- Watch Parties (list) ---------- */
  .party-card{display:flex;gap:12px;align-items:center;margin:0 14px 14px;padding:10px;background:var(--bg-elev);border:1px solid var(--line);border-radius:14px;cursor:pointer;}
  .party-thumb{position:relative;width:100px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--card);}
  .party-thumb img,.party-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
  .live-tag{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.75);color:#ff5c68;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.3px;}
  .party-info{flex:1;min-width:0;}
  .party-title{font-size:13.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .party-sub{font-size:11.5px;color:var(--grey);margin-top:3px;}
  .party-avatars{margin-top:7px;display:flex;}
  .p-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;border:2px solid var(--bg-elev);margin-left:-8px;flex-shrink:0;}
  .p-avatar:first-child{margin-left:0;}
  .p-avatar.more{background:#3a3a42;}
  .party-start-row{display:flex;gap:12px;align-items:center;padding:8px 14px;cursor:pointer;}

  /* ---------- Watch Party (in player) ---------- */
  #party-bar{margin:0 14px 14px;padding:13px;border-radius:14px;background:linear-gradient(135deg,rgba(139,46,255,.14),rgba(139,46,255,.03));border:1px solid rgba(139,46,255,.3);}
  .party-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .party-meta{flex:1;min-width:0;}
  .party-meta b{font-size:13.5px;display:block;}
  .party-meta span{font-size:11.5px;color:var(--grey);}
  .party-leave{font-size:12px;font-weight:700;color:#ff8c93;background:var(--red-soft);padding:6px 11px;border-radius:12px;flex-shrink:0;}
  .party-reactions{max-height:80px;overflow-y:auto;font-size:12.5px;color:var(--ink-soft);margin-bottom:9px;display:flex;flex-direction:column;gap:5px;scrollbar-width:none;}
  .party-reactions::-webkit-scrollbar{display:none;}
  .party-msg b{color:var(--ink);margin-right:4px;}
  .party-emojis{display:flex;gap:7px;margin-bottom:10px;}
  .party-emojis button{font-size:19px;background:var(--chip);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .party-emojis button:active{background:#2c2c33;}
  .party-chat-row{display:flex;gap:8px;}

const fmt = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
const epDur = (v,n) => 360 + ((n*97 + v.id*131) % 540);           // 6:00–14:59
function epName(v,n){ const i=n-1, base=v.names[i%v.names.length], round=Math.floor(i/v.names.length); let t = round? base+' — Part '+(round+1) : base; return n===v.eps ? 'Finale: '+t : t; }
function gradThumb(c1,c2,emoji,w=640,h=360){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="54%" font-size="${h*.34}" text-anchor="middle" dominant-baseline="middle">${emoji}</text></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

/* Static thumbnail image. Used everywhere a series is shown; no video is loaded for it.
   If the image file is missing, the global error handler below swaps in a gradient. */
function thumb(v,style){
  return `<img src="${v.thumb}" data-fb="${v.id}" alt="" draggable="false" decoding="async" ${style?`style="${style}"`:''}>`;
}
/* Thumbnail + an EMPTY video (no src) + spinner. The video only gets a src while the card is previewing. */
function previewMedia(v){
  return thumb(v)+`<video class="t-vid" muted loop playsinline preload="none" tabindex="-1"></video><div class="vid-spinner"></div>`;
}
/* Missing thumbnail image → gradient placeholder (error events don't bubble, so listen in capture phase) */
document.addEventListener('error',e=>{
  const t=e.target;
  if(t && t.tagName==='IMG' && t.dataset && t.dataset.fb!==undefined && !t.dataset.fbDone){
    const v=series[+t.dataset.fb]; if(!v) return;
    t.dataset.fbDone='1';
    t.src=gradThumb(v.c1,v.c2,v.emoji);
  }
},true);

function isUnlocked(v,n){ return n<=FREE_EPS || vipActive() || !!(state.unlocked[v.id]&&state.unlocked[v.id][n]); }
const seriesPct = v => { const w=state.watched[v.id]; if(!w) return 0; return Math.round(Object.values(w).reduce((a,b)=>a+b,0)/(v.eps*100)*100); };
const watchedCount = v => Object.values(state.watched[v.id]||{}).filter(p=>p>=95).length;

/* =====================================================================
   "AI" RECOMMENDER (simulated: tag-affinity scoring that learns from
   opens, likes, saves, finished episodes and "not interested")
   ===================================================================== */
function bump(tags,w){ tags.forEach(t=>state.profile[t]=(state.profile[t]||0)+w); }
function score(v){
  let s=0; v.tags.forEach(t=>s+=state.profile[t]||0); s/=Math.sqrt(v.tags.length);
  if(watchedCount(v)>=v.eps*.9) s-=1;
  return s;
}
const match = v => Math.round(64+34/(1+Math.exp(-(score(v)-1.2)*.9)));
const ranked = ex => series.filter(v=>v.id!==ex).sort((a,b)=>score(b)-score(a));
const topTags = (n=3) => Object.entries(state.profile).sort((a,b)=>b[1]-a[1]).slice(0,n).map(e=>e[0]);
function reason(v){
  const last=state.last && series[state.last.sid];
  if(last && last.id!==v.id){ const shared=last.tags.filter(t=>v.tags.includes(t)); if(shared.length) return `Because you watched “${last.title.split(' ').slice(0,4).join(' ')}…”`; }
  const t=v.tags.slice().sort((a,b)=>(state.profile[b]||0)-(state.profile[a]||0))[0];
  return `Because you enjoy ${TAG_LABEL[t]||t}`;
}

/* ---------- Ads ---------- */
function pickAd(tags,used=[],seed=0){
  let pool=ads.filter(a=>!used.includes(a.id)); if(!pool.length) pool=ads;
  let best=pool[0],bs=-1;
  pool.forEach((a,i)=>{ const s=a.tags.filter(t=>tags.includes(t)).length*10+((i*7+seed)%5)*.1; if(s>bs){bs=s;best=a;} });
  used.push(best.id); return best;
}

/* =====================================================================
   AUTO PREVIEW (Netflix-style)
   - Every card shows its static thumbnail by default; its <video> has NO src.
   - A card that stays ≥60% in view for ~0.9s starts a preview: a spinner is shown,
     the video src is assigned, and the thumbnail stays on screen until the
     video is actually playing. Then the video fades in over it.
   - When the card leaves the viewport (or the view changes), the video is
     paused and unloaded (src removed) so only visible cards hold a video.
   ===================================================================== */
const previewObservers = {};
const activePreviews = new Set();

function bindPreviewVideo(el,vid){
  if(vid._bound) return; vid._bound=true;
  vid.addEventListener('playing',()=>{                 // first real frames are on screen → reveal video, hide thumbnail
    if(!vid.getAttribute('src')) return;
    el.classList.add('vid-ready'); el.classList.remove('loading');
  });
  vid.addEventListener('waiting',()=>{                 // stalled / buffering → spinner again
    if(vid.getAttribute('src') && el.classList.contains('previewing')) el.classList.add('loading');
  });
  vid.addEventListener('error',()=>{                   // keep the thumbnail if the video can't load
    if(!vid.getAttribute('src')) return;
    el.classList.remove('loading','vid-ready');
  });
}
function startPreview(el){
  const vid=el.querySelector('video.t-vid'); if(!vid) return;
  bindPreviewVideo(el,vid);
  el.classList.add('previewing','loading');
  activePreviews.add(el);
  if(!vid.getAttribute('src')) vid.src=SAMPLE_VIDEO;   // the ONLY place a card video gets a source
  const p=vid.play(); if(p&&p.catch) p.catch(()=>{});
}
function stopPreview(el){
  clearTimeout(el._pvTimer); el._pvTimer=null;
  el.classList.remove('previewing','loading','vid-ready');
  activePreviews.delete(el);
  const vid=el.querySelector('video.t-vid');
  if(vid && vid.getAttribute('src')){ vid.pause(); vid.removeAttribute('src'); vid.load(); }   // unload
}
function attachPreview(containerId){
  const root=$(containerId); if(!root) return;
  // clean up previews whose cards were just re-rendered away
  activePreviews.forEach(el=>{ if(!el.isConnected) stopPreview(el); });
  if(previewObservers[containerId]) previewObservers[containerId].disconnect();
  const io=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const el=en.target;
      if(en.isIntersecting && en.intersectionRatio>=0.6){
        if(!el._pvTimer && !el.classList.contains('previewing')){
          el._pvTimer=setTimeout(()=>{ el._pvTimer=null; startPreview(el); },900);
        }
      } else {
        stopPreview(el);
      }
    });
  },{threshold:[0,0.6]});
  previewObservers[containerId]=io;
  root.querySelectorAll('.thumb-wrap[data-sid]').forEach(el=>io.observe(el));
}

function renderHome(){
  const used=[];
  let list, ai=false;
  if(state.chip==='foryou'){ list=ranked(); ai=true; }
  else if(state.chip==='all'){ list=series.slice(); }
  else list=series.filter(v=>v.tags.includes(state.chip)).sort((a,b)=>score(b)-score(a));

  let html='';
  if(state.chip==='foryou' && state.last){
    const v=series[state.last.sid], n=state.last.ep, pct=(state.watched[v.id]||{})[n]||0;
    html+=`<div class="continue" onclick="openSeries(${v.id},${n})">

  if(ai) html+=`<div class="ai-strip">${spark(15)}<span>Ranked for you. Updates as you watch and like.</span></div>`;

  if(!vipActive()) html+=vipStripHTML();
  const slots = list.length>=5 ? [1,4] : [Math.min(1,list.length-1)];
  list.forEach((v,i)=>{
    html+=cardHTML(v, ai?{ai:true,why:reason(v)}:{});
    if(slots.includes(i)) html+=adCardHTML(pickAd(topTags(4).concat(v.tags),used,i));
  });
  if(!list.length) html+='<div class="empty">Nothing here yet.</div>';
  html+=bannerAdHTML(pickAd(topTags(4),used,3));

  attachPreview('home-feed');

const playSVG='<path d="M8 5v14l11-7z"/>', pauseSVG='<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';

/* ---------- Player video loading (thumbnail → spinner → video) ---------- */
const pvid = $('player-thumb');
state.sound = true;                          // sound is ON for the main player; card previews stay muted
const VOL_ON  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
const VOL_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
function updateSoundUI(){ const b=$('snd-btn'); if(b) b.innerHTML = state.sound ? VOL_ON : VOL_OFF; }
function toggleSound(){

/* Play the main video with sound. If the browser blocks unmuted autoplay, fall back to muted
   and let the speaker button turn sound on with a tap. */
function playMain(){
  pvid.muted=!state.sound;
  const p=pvid.play();
  if(p && p.catch) p.catch(err=>{
    if(err && err.name==='NotAllowedError' && !pvid.muted){

      pvid.play().catch(()=>{});

}
updateSoundUI();

function isBuffering(){
  return !!(state.cur && state.playing && !state.ad && !state.vid.failed && (!state.vid.ready || state.vid.waiting));
}
function updateBufferUI(){
  const w=$('player-wrap');
  w.classList.toggle('buffering',isBuffering());
  w.classList.toggle('vid-ready',state.vid.ready && !state.vid.failed);
}
function setPlayerPoster(v){
  const img=$('player-poster');
  delete img.dataset.fbDone;
  img.dataset.fb=v.id;
  img.src=v.thumb;
}
function ensurePlayerSrc(){
  if(!pvid.getAttribute('src')) pvid.src=SAMPLE_VIDEO;   // the video is only loaded while the player is open
}
function resetPlayerVideo(){                              // unload + show the thumbnail again
  try{ pvid.pause(); }catch(e){}
  pvid.removeAttribute('src'); pvid.load();
  state.vid={ ready:false, failed:false, waiting:false };
  updateBufferUI();
}
pvid.addEventListener('playing',()=>{
  if(!pvid.getAttribute('src')) return;
  state.vid.ready=true; state.vid.failed=false; state.vid.waiting=false; updateBufferUI();
});
pvid.addEventListener('waiting',()=>{
  if(!pvid.getAttribute('src')) return;
  state.vid.waiting=true; updateBufferUI();
});
pvid.addEventListener('canplay',()=>{
  if(!pvid.getAttribute('src')) return;
  state.vid.waiting=false;
  if(state.playing && !state.ad && pvid.paused) playMain();
  updateBufferUI();
});
pvid.addEventListener('error',()=>{
  if(!pvid.getAttribute('src')) return;
  state.vid.failed=true; state.vid.ready=false; state.vid.waiting=false; updateBufferUI();
});

function openSeries(id,ep){
  const v=series[id];
  if(state.view!=='player') state.prevView=state.view;
  state.cur=v; bump(v.tags,1);
  const start = ep || (state.lastEp[id]||1);
  state.epsSinceAd=99;                       // pre-roll on open
  resetPlayerVideo();                        // drop any previous series' video
  setPlayerPoster(v);
  $('player-title').textContent=`${v.title} ${v.emoji}`;
  $('player-meta').textContent=`${v.eps} episodes · ${v.views} views`;
  $('like-count').textContent=v.likes;
  goto('player');
  $('player-scroll').scrollTop=0;
  renderMore();
  renderComments();
  startEpisode(start);
  syncPlayerH();
}
function closePlayer(){ state.playing=false; resetPlayerVideo(); goto(state.prevView||'home'); }

function episodeClick(sid,n){
  if(state.cur && state.cur.id===sid){ startEpisode(n); }
  else openSeries(sid,n);
}
function startEpisode(n){
  const v=state.cur;
  if(!isUnlocked(v,n)){ state.playing=false; try{ pvid.pause(); }catch(e){} updateBufferUI(); openUnlockModal(v.id,n); return; }
  state.ep=n; state.rangeStart=Math.floor((n-1)/20)*20+1;
  state.last={sid:v.id,ep:n}; state.lastEp[v.id]=n;
  const prior=(state.watched[v.id]||{})[n]||0;
  state.pct = prior>=95 ? 0 : prior;
  $('player-now').textContent=`Episode ${n} of ${v.eps} · ${epName(v,n)}`;
  resetAI(); updateActionUI();
  resetPlayerVideo();                        // thumbnail back on screen until this episode plays
  if(state.epsSinceAd>=AD_EVERY){ state.epsSinceAd=0; startAd(); ensurePlayerSrc(); } else { state.playing=true; showControls(); }   // during an ad, start buffering behind it
  state.epsSinceAd++;
  renderPlayerBanner(); renderEpisodes();   // after the ad decision so advertisers don't repeat on one screen
  renderPartyBar();
  updatePlayerUI();
}
function stepEp(d){ const n=state.ep+d; if(n<1||n>state.cur.eps) return; startEpisode(n); }

function updatePlayerUI(){
  const v=state.cur; if(!v) return;
  const dur=epDur(v,state.ep);
  $('player-wrap').classList.toggle('playing',state.playing&&!state.ad);
  $('player-wrap').classList.toggle('ad-on',!!state.ad);
  $('ad-overlay').classList.toggle('show',!!state.ad);
  $('play-icon').innerHTML=state.playing?pauseSVG:playSVG;
  $('cur-time').textContent=fmt(state.pct/100*dur);
  $('dur-time').textContent=fmt(dur);
  $('progress-fill').style.width=state.pct+'%';
  $('ep-chip').textContent=`EP ${state.ep}/${v.eps}`;
  $('cc-btn').classList.toggle('on',state.subtitles);
  $('subtitle-overlay').classList.toggle('show',state.subtitles&&!state.ad);
  updateSubtitleText();
  if(state.playing&&!state.ad){
    ensurePlayerSrc();
    if(pvid.paused) playMain();
  } else if(!pvid.paused){
    pvid.pause();
  }
  updateBufferUI();
}

/* ---------- Auto-hide controls while playing ---------- */

  w.classList.add('show-controls');
  clearTimeout(controlsTimer);
  if(state.playing && !state.ad){
    controlsTimer=setTimeout(()=>w.classList.remove('show-controls'),3000);
  }

function onPlayerTap(e){
  if(state.ad) return;
  if(state.playing){
    const w=$('player-wrap');

function startAd(){

/* ---------- Fullscreen ---------- */
function toggleFullscreen(){
  const el=$('player-wrap');
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req){ toast('Fullscreen not supported here'); return; }
    Promise.resolve(req.call(el)).catch(()=>toast('Fullscreen not available here'));
  } else {
    const exit=document.exitFullscreen||document.webkitExitFullscreen;
    if(exit) Promise.resolve(exit.call(document)).catch(()=>{});
  }
}

}

/* ---------- Playback loop ---------- */
setInterval(()=>{
  if(state.view!=='player'||!state.cur) return;
  if(state.ad){ state.adT+=.25; updateAdUI(); if(state.adT>=8) endAd(); return; }
  if(!state.playing) return;
  if(isBuffering()) return;                 // hold the progress bar while the video is still loading / buffering
  const v=state.cur, dur=epDur(v,state.ep);
  state.pct+=(.25*SPEED/dur)*100;
  if(state.pct>=100){
    state.pct=100; saveProgress(); bump(v.tags,.2);
    const nextLocked = state.ep<v.eps && !isUnlocked(v,state.ep+1);
    if(state.autoplay && state.ep<v.eps && !nextLocked){ toast(`Up next: Episode ${state.ep+1}`); startEpisode(state.ep+1); }
    else {
      state.playing=false;
      toast(nextLocked?'Unlock the next episode to keep watching':(state.ep>=v.eps?'You finished the series':'Episode finished'));
      renderEpisodes();
      if(nextLocked) openUnlockModal(v.id,state.ep+1);
    }
    updatePlayerUI(); return;
  }
  saveProgress(); updatePlayerUI(); updateRowProgress();
},250);
function saveProgress(){
  const v=state.cur; if(!state.watched[v.id]) state.watched[v.id]={};
  state.watched[v.id][state.ep]=Math.max(state.watched[v.id][state.ep]||0,state.pct);
}
function updateRowProgress(){
  const row=$('ep-row-'+state.ep); if(!row) return;
  const i=row.querySelector('.ep-prog i'); if(i) i.style.width=Math.min(100,state.watched[state.cur.id][state.ep])+'%';
}

/* ---------- Scrubbing ---------- */
let dragging=false; const track=$('progress-track');
function scrub(e){
  if(state.ad) return;
  const r=track.getBoundingClientRect(), x=e.touches?e.touches[0].clientX:e.clientX;
  state.pct=Math.max(0,Math.min(100,(x-r.left)/r.width*100)); updatePlayerUI();
}
track.addEventListener('mousedown',e=>{dragging=true;scrub(e);});
track.addEventListener('touchstart',e=>{dragging=true;scrub(e);},{passive:true});
window.addEventListener('mousemove',e=>{if(dragging)scrub(e);});
window.addEventListener('touchmove',e=>{if(dragging)scrub(e);},{passive:true});
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('touchend',()=>dragging=false);

/* =====================================================================
   SEARCH: autocomplete, inline ghost text, typo fixes, semantic ranking
   ===================================================================== */
const VOCAB=new Set(); series.forEach(v=>(v.title+' '+v.tagline).toLowerCase().split(/[^a-z]+/).forEach(w=>w.length>3&&VOCAB.add(w)));
Object.keys(SYN).forEach(w=>w.length>3&&VOCAB.add(w)); Object.keys(TAG_LABEL).forEach(w=>w.length>3&&VOCAB.add(w));
STOP.forEach(w=>VOCAB.add(w));
AI_QUERIES.concat(TOPICS).forEach(a=>a.text.toLowerCase().split(/[^a-z]+/).forEach(w=>w&&VOCAB.add(w)));
TRENDING.concat(MOODS.map(m=>m[2])).forEach(t=>t.toLowerCase().split(/[^a-z]+/).forEach(w=>w&&VOCAB.add(w)));
function lev(a,b){ const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0))); for(let j=1;j<=n;j++)d[0][j]=j; for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function didYouMean(q){
  let changed=false;
  const out=q.toLowerCase().split(/\s+/).map(t=>{
    if(t.length<4||VOCAB.has(t)||[...VOCAB].some(w=>w.startsWith(t))) return t;
    let best=null,bd=9; VOCAB.forEach(w=>{ const d=lev(t,w); if(d<bd){bd=d;best=w;} });
    if(best&&bd<=(t.length<=5?1:2)){ changed=true; return best; } return t;
  });
  return changed?out.join(' '):null;
}
function corpus(){
  const c=[];
  state.recent.forEach(t=>c.push({text:t,kind:'recent',tags:[]}));
  series.forEach(v=>c.push({text:v.title,kind:'video',tags:v.tags}));
  AI_QUERIES.forEach(a=>c.push({text:a.text,kind:'ai',tags:a.tags}));
  TOPICS.forEach(a=>c.push({text:a.text,kind:'topic',tags:a.tags}));
  return c;
}
function suggest(q){
  q=q.toLowerCase().trim(); if(!q) return [];
  const toks=q.split(/\s+/), seen=new Set(), out=[];
  corpus().forEach(c=>{
    const t=c.text.toLowerCase(); let s=0;
    if(t.startsWith(q)) s=100;
    else if((' '+t).includes(' '+q)) s=70;
    else if(toks.every(k=>t.includes(k))) s=50;
    else if(toks.some(k=>(SYN[k]||[]).some(x=>c.tags.includes(x)))) s=25;
    if(!s) return;
    if(c.kind==='recent') s+=8; if(c.kind==='ai') s+=2;
    if(seen.has(t)) return; seen.add(t); out.push(Object.assign({s},c));
  });
  return out.sort((a,b)=>b.s-a.s).slice(0,6);
}
function updateGhost(){
  const q=$('search-input').value, g=$('ghost');
  state.ghostFull=''; g.innerHTML='';
  if(!q||state.searchMode==='results') return;
  const top=suggest(q).find(s=>s.text.toLowerCase().startsWith(q.toLowerCase())&&s.text.length>q.length);
  if(top){ const rest=top.text.slice(q.length); state.ghostFull=q+rest; g.innerHTML=`<span style="visibility:hidden">${esc(q)}</span><span class="hint">${esc(rest)}</span>`; }
}
function icon(kind){
  if(kind==='ai') return spark(15);
  if(kind==='recent') return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  if(kind==='video') return '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
}
function sgRow(text,kind,q){
  const hl = q && text.toLowerCase().startsWith(q.toLowerCase()) ? `<b>${esc(text.slice(0,q.length))}</b>${esc(text.slice(q.length))}` : esc(text);
  return `<div class="sg-row ${kind==='ai'?'ai':''}" data-q="${esc(text)}" onclick="submitSearch(this.dataset.q)">
    <div class="sg-ic">${icon(kind)}</div><div class="sg-text">${hl}${kind==='ai'?'<span class="sg-tag">AI</span>':''}</div>
    <button class="fill" onclick="event.stopPropagation();fillSearch(this.parentElement.dataset.q)" aria-label="Use suggestion"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17 7L7 17M7 9v8h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`;
}
function idleHTML(){
  let h='';
  if(state.recent.length) h+=`<div class="sg-title">Recent<button onclick="state.recent=[];renderSearch()">Clear</button></div>`+state.recent.map(t=>sgRow(t,'recent','')).join('');
  h+=`<div class="sg-title">Trending</div>`+TRENDING.map(t=>sgRow(t,'topic','')).join('');
  h+=`<div class="sg-title">${spark(13)}&nbsp;Try asking AI</div>`+AI_QUERIES.slice(0,3).map(a=>sgRow(a.text,'ai','')).join('');
  return h;
}
function suggestHTML(q){
  const dym=didYouMean(q);
  let h=dym?`<div class="dym">Did you mean <button data-q="${esc(dym)}" onclick="submitSearch(this.dataset.q)">${esc(dym)}</button>?</div>`:'';
  const list=suggest(dym||q);
  h+=list.map(s=>sgRow(s.text,s.kind,dym?'':q)).join('');
  h+=sgRow(q,'topic','');
  return h;
}
function runQuery(q){
  const toks=q.toLowerCase().split(/[^a-z']+/).filter(t=>t&&!STOP.has(t)), tags=new Set();
  toks.forEach(t=>{ (SYN[t]||[]).forEach(x=>tags.add(x)); series.forEach(v=>{ if(v.tags.includes(t)) tags.add(t); }); });
  const res=series.map(v=>{
    let s=0; const title=v.title.toLowerCase(), tl=v.tagline.toLowerCase(), words=title.split(/\s+/);
    toks.forEach(t=>{ if(title.includes(t)) s+=3; else if(words.some(w=>w.startsWith(t))) s+=2; if(tl.includes(t)) s+=1.5; if(v.tags.includes(t)) s+=2.5; (SYN[t]||[]).forEach(x=>{ if(v.tags.includes(x)) s+=1.2; }); });
    return {v,s};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||match(b.v)-match(a.v));
  return {toks,tags:[...tags],res};
}
const qMatch = s => Math.min(99,Math.round(72+s*4));
function resultsHTML(q){
  let r=runQuery(q), h='', note='';
  if(!r.res.length){ const dym=didYouMean(q); if(dym){ r=runQuery(dym); note=`<div class="dym">Showing results for <button data-q="${esc(dym)}" onclick="submitSearch(this.dataset.q)">${esc(dym)}</button></div>`; } }
  h+=note;
  if(!r.res.length) return h+`<div class="empty">No exact matches for “${esc(q)}”.<br>Here's what fits your taste instead.</div>`+ranked(-1).slice(0,3).map(v=>cardHTML(v,{ai:true,why:reason(v)})).join('');
  h+=`<div class="understood">${spark(14)}<span style="color:#ff8c93;font-weight:700">AI understood</span>${r.tags.slice(0,4).map(t=>`<span class="tagpill">${esc(t)}</span>`).join('')}</div>`;
  const used=[];
  r.res.forEach((x,i)=>{ h+=cardHTML(x.v,{match:qMatch(x.s),why:(m=>m.length?'Matches: '+m.join(', '):undefined)(x.v.tags.filter(t=>r.tags.includes(t)).slice(0,2))}); if(i===1||(i===r.res.length-1&&r.res.length<2)) h+=adCardHTML(pickAd(x.v.tags,used,i)); });
  return h;
}
function renderSearch(){
  const q=$('search-input').value; $('clear-btn').style.display=q?'flex':'none';
  if(state.searchMode==='results'&&q.trim()) $('search-body').innerHTML=resultsHTML(q);
  else if(q.trim()){ state.searchMode='suggest'; $('search-body').innerHTML=suggestHTML(q.trim()); }

  q=(q||'').trim(); if(!q) return;

function askAI(q){
  q=(q||'').trim(); if(!q) return;
  const token=++state.aiAskToken; $('ai-out').dataset.mode='answer';
  $('ai-out').innerHTML=`<div class="thinking"><div class="dots"><i></i><i></i><i></i></div><span>Reading ${series.length} series, ${series.reduce((a,v)=>a+v.eps,0)} episodes…</span></div>`;

/* ---------- VIP (weekly subscription, $5 USD) ---------- */
const VIP_PRICE='$5.00', WEEK=7*24*3600*1000;
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
/* Active while subscribed. Auto-renews every 7 days; a cancelled plan stays active until its end date. VIP belongs to the account, so it needs a login. */
function vipActive(){
  const v=state.vip; if(!v.on || !state.auth.loggedIn) return false;
  const now=Date.now();
  if(now>=v.renews){
    if(v.cancelled){ v.on=false; v.cancelled=false; return false; }
    while(v.renews<=now) v.renews+=WEEK;              // simulated weekly renewal
  }
  return true;
}
function vipStripHTML(inline){

         :`<button class="cta sm" style="width:100%;padding:12px;background:var(--chip);color:var(--ink)" onclick="confirmCancelVip()">Cancel VIP</button>`}`;

    <div class="vip-fine">You'll be charged ${VIP_PRICE} today, then every 7 days until you cancel. (Simulated in this prototype.)</div>
    <div id="purchase-status"></div>`;
}
function subscribeVip(){
  const status=$('purchase-status'); if(!status) return;
  status.innerHTML=`<div class="thinking" style="margin:14px 0 0"><div class="dots"><i></i><i></i><i></i></div><span>Processing payment…</span></div>`;
  setTimeout(()=>{
    const t=state.unlockTarget;                        // episode the user was trying to open (closeModal clears it)
    state.vip={on:true,cancelled:false,renews:Date.now()+WEEK};

function pickerSheetHTML(title,options,current,onSelect,note){
  return `<div class="grab"></div><div class="sheet-title">${title}</div>
    ${options.map(o=>`<button class="sheet-item" onclick="${onSelect}('${o}')">${o===current?checkSVG:'<span style="width:20px;display:inline-block"></span>'}${o}</button>`).join('')}
    ${note?`<div class="modal-sub" style="padding:8px 18px 2px">${note}</div>`:''}`;
}
function openLangSheet(){
  $('sheet').innerHTML=pickerSheetHTML('Language',LANGUAGES,state.settings.language,'setLanguage');
  $('backdrop').classList.add('show'); $('sheet').classList.add('show');
}
function setLanguage(v){ state.settings.language=v; closeSheet(); toast('Language set to '+v); renderSettingsView(); }
function openCurrencySheet(){
  $('sheet').innerHTML=pickerSheetHTML('Currency',CURRENCIES,state.settings.currency,'setCurrency');
  $('backdrop').classList.add('show'); $('sheet').classList.add('show');
}
function setCurrency(v){ state.settings.currency=v; closeSheet(); toast('Currency set to '+v); renderSettingsView(); }
function openDubbingSheet(){
  $('sheet').innerHTML=pickerSheetHTML('Dubbing',DUBBING_OPTIONS,state.settings.dubbing,'setDubbing','"Auto" matches dubbing to your device language whenever it\'s available.');
  $('backdrop').classList.add('show'); $('sheet').classList.add('show');
}
function setDubbing(v){ state.settings.dubbing=v; closeSheet(); toast('Dubbing set to '+v); renderSettingsView(); }

/* ---------- Delete account ---------- */
function confirmDeleteAccount(){
  openModal(`<div class="modal-title">${ICONS.trash(20)} Delete account?</div>
    <div class="modal-sub">This will permanently delete your profile, wallet balance and watch history. This can't be undone.</div>
    <button class="cta" style="width:100%;justify-content:center;padding:12px;margin-top:6px;background:var(--red-dark)" onclick="deleteAccount()">Delete my account</button>
    <button class="cta sm" style="width:100%;justify-content:center;margin-top:10px;background:var(--chip);color:var(--ink)" onclick="closeModal()">Cancel</button>`);
}
function deleteAccount(){
  state.auth={loggedIn:false,name:'',email:''}; state.wallet=0; state.vip={on:false,cancelled:false,renews:0}; state.unlocked={}; state.saved={}; state.likes={};
  closeModal(); renderTopbarAuth(); toast('Account deleted (prototype)'); renderSettingsView();
}

/* ---------- Privacy / about / rate us ---------- */
function openPrivacyModal(){
  if(!state.settings.privacy) state.settings.privacy={personalized:true,shareActivity:true,analytics:true};
  const p=state.settings.privacy;
  openModal(`<div class="modal-title">${ICONS.shield(20)} Privacy settings</div>
    <div class="modal-sub">Control how your data is used across HENZFLIX.</div>
    <div class="settings-group">
      <div class="settings-item"><div class="si-text">Personalized recommendations</div><div class="switch ${p.personalized?'on':''}" onclick="togglePrivacy('personalized')"></div></div>
      <div class="settings-item"><div class="si-text">Show my activity to friends</div><div class="switch ${p.shareActivity?'on':''}" onclick="togglePrivacy('shareActivity')"></div></div>
      <div class="settings-item"><div class="si-text">Share usage analytics</div><div class="switch ${p.analytics?'on':''}" onclick="togglePrivacy('analytics')"></div></div>
    </div>`);
}
function togglePrivacy(k){ state.settings.privacy[k]=!state.settings.privacy[k]; openPrivacyModal(); }
function openAboutModal(){
  openModal(`<div class="modal-title">${ICONS.info(20)} About HENZFLIX</div>
    <div class="modal-sub">HENZFLIX is a short-episode drama app for stories that stay with you — bite-sized episodes you can watch anywhere, anytime.</div>
    <div class="modal-sub">Version 2.4.1 · Prototype build</div>
    <div class="modal-sub">© 2026 HENZFLIX, Inc. All rights reserved.</div>`);
}
function rateUs(){
  openModal(`<div class="modal-title">${ICONS.star(20)} Enjoying HENZFLIX?</div>
    <div class="modal-sub">Let us know what you think — it helps other viewers find us.</div>
    <div style="display:flex;gap:8px;justify-content:center;margin:6px 0 16px">${[1,2,3,4,5].map(n=>`<button onclick="rateStars(${n})" style="font-size:26px">⭐</button>`).join('')}</div>`);
}
function rateStars(n){ closeModal(); toast(n>=4?'Thanks! Taking you to the app store (prototype)':'Thanks for the feedback (prototype)'); }

/* =====================================================================
   INIT
   ===================================================================== */
renderChips(); renderHome(); renderWalletBadge(); renderTopbarAuth();
</script>
</body>
